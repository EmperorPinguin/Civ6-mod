Menelik II = Menelik II
Your actions insult the people of Ethiopia, and for that you must pay a heavy price. = Hành động của các người xúc phạm nhân dân Ethiopia, và các người sẽ phải trả giá đắt cho điều đó.
Do you not know that the Lion of Judah has always conquered? Well, you will learn soon enough. = Ngươi không biết rằng Sư tử xứ Judah luôn luôn chiến thắng sao? Được rồi, ngươi sẽ sớm học được bài học đó thôi.
Do you think God abandoned Ethiopia? Do you think his favor rests on you? Do not gloat in your victory today. = Ngươi nghĩ Thượng đế đã ruồng bỏ Ethiopia sao? Ngươi nghĩ ân huệ của Người đang thuộc về ngươi sao? Đừng vội hả hê trong chiến thắng ngày hôm nay.
I am Menelik, Lion of Judah, of the house and lineage of Solomon, emperor of Ethiopia. Greetings. = Ta là Menelik, Sư tử xứ Judah, thuộc dòng dõi vua Solomon, Hoàng đế Ethiopia. Xin chào.
You are on the right side of history. = Bạn đang đứng về phía lẽ phải của lịch sử.
Your rule is a disgrace = Sự cai trị của ngươi là một nỗi ô nhục
Ethiopia sends you our warm wishes. = Ethiopia gửi đến bạn những lời chúc ấm áp nhất.
Aksumite Legacy = Di sản Vương quốc Aksum

France = Pháp
Catherine de Medici = Catherine de Médici
Masquerading as friends was kind of fun, wasn't it? Unfortunately it's time to drop the pretense and get to the business at hand. = Giả vờ làm bạn bè cũng vui đấy chứ nhỉ? Rất tiếc là đã đến lúc phải dẹp bỏ sự giả vờ đó và bắt tay vào việc chính rồi.
You dare attack my sovereign realm? I don't believe even Nostradamus could have predicted this! = Ngươi dám tấn công lãnh thổ có chủ quyền của ta sao? Ta không tin ngay cả Nostradamus cũng có thể tiên đoán được điều này!
I have lived long enough to know when I am defeated. Carry on. = Tôi đã sống đủ lâu để biết khi nào mình thất bại. Cứ tiếp tục đi.
I am Catherine, the Queen Mother of France, and I welcome you to the realm. I do so look forward to learning all there is to know about you. = Tôi là Catherine, Hoàng thái hậu nước Pháp, và tôi chào mừng bạn đến với vương quốc. Tôi rất mong được tìm hiểu mọi điều về bạn.
Carry on. = Cứ tiếp tục đi.
What would your friends think of this information? = Bạn bè của bạn sẽ nghĩ gì về những thông tin này nhỉ?
I have sent you a trade delegation with all of the customary gifts. = Tôi đã gửi cho bạn một phái đoàn thương mại với đầy đủ quà tặng theo thông lệ.
Grand Tour = Hành trình Khám phá Grand Tour

Gaul = Gaul
Ambiorix = Ambiorix
I have bested many enemies in war before, and finally I shall match my strength against yours! = Ta từng đánh bại nhiều kẻ thù trong chiến tranh, và cuối cùng ta cũng được đọ sức với ngươi!
Peace is stifling. Only in war can we see who is the greater chief. = Hòa bình thật ngột ngạt. Chỉ trong chiến tranh chúng ta mới biết ai là thủ lĩnh vĩ đại hơn.
Such power! Perhaps I underestimated you before. Now, in defeat, I will give you the respect you are due. = Thật là sức mạnh đáng nể! Có lẽ trước đây ta đã đánh giá thấp ngươi. Giờ đây, trong thất bại, ta dành cho ngươi sự tôn trọng xứng đáng.
All you see is the land of the Gauls, and I am Ambiorix, their chief. = Tất cả những gì ngươi thấy là đất đai của người Gaul, và ta là Ambiorix, thủ lĩnh của họ.
We stand as kin! = Chúng ta kề vai như anh em ruột thịt!
I understand. You must be careful. = Tôi hiểu rồi. Bạn phải cẩn thận đấy.
Come, let us feast! = Hãy đến đây, chúng ta cùng mở tiệc nào!
Hallstatt Culture = Văn hóa Hallstatt
+1 Culture from every Mine, -25% Gold and Culture cost of acquiring new tiles, and Districts receive yields from adajacent Mines instead adjacent Districts = +1 Văn hóa từ mỗi Mỏ, -25% chi phí Vàng và Văn hóa mua ô mới, và các Quận nhận sản lượng từ Mỏ liền kề thay vì Quận liền kề

Georgia = Georgia
Tamar = Tamar
God fights with us. You stand alone. = Thượng đế chiến đấu bên cạnh chúng ta. Ngươi chỉ có một mình mà thôi.
Georgian hearts will not tremble before your multitudes. = Trái tim của người Georgia sẽ không run sợ trước đoàn quân đông đảo của các ngươi.
Walls weren't enough to save Georgia from ruin. Neither was I. = Những bức tường thành không đủ để cứu Georgia khỏi diệt vong. Và ta cũng vậy.
I am Tamar of Georgia. Say what you will and be on your way. = Ta là Tamar xứ Georgia. Cứ nói những gì ngươi muốn rồi tiếp tục lên đường đi.
I notice your sincerity. = Tôi nhận thấy sự chân thành của bạn.
You are a detestable person. = Ngươi là một kẻ đáng ghê tởm.
Georgian merchants bring many gifts. = Các thương nhân Georgia mang theo nhiều tặng phẩm.
Strength in Unity = Sức mạnh trong Đoàn kết
+50% Production when constructing Walls in all cities, +1 Movement for all units during Golden Age, +10% Strength for all units during a Golden Age = +50% Sản xuất khi xây Tường thành ở tất cả các thành phố, +1 Di chuyển cho mọi đơn vị trong Thời kỳ Hoàng kim, +10% Sức mạnh cho mọi đơn vị trong Thời kỳ Hoàng kim

Germany = Đức
Frederick Barbarossa = Frederick Barbarossa
Let it be known: you are an enemy of Germany and must be destroyed. May God have mercy on you, for I will not. = Hãy nhớ lấy: ngươi là kẻ thù của nước Đức và phải bị tiêu diệt. Cầu xin Thượng đế thương xót ngươi, vì ta thì không đâu.
I have defeated enemies ten times as powerful as you. You will be just one more for the historians. = Ta từng đánh bại những kẻ thù mạnh gấp mười lần ngươi. Ngươi sẽ chỉ là một cái tên nữa trong sách sử mà thôi.
We were the august and glorious… but no, never mind that. You are victorious. May your reign be more peaceful than mine ever was. = Chúng ta từng uy nghi và huy hoàng... nhưng thôi, không cần bận tâm nữa. Ngươi đã chiến thắng. Cầu mong triều đại của ngươi yên bình hơn những gì ta từng trải qua.
Greetings. I am the Holy Roman Emperor Frederick, King of Germany, Italy, Burgundy, and many others. I trust that you will rule your lands as I do: through might. = Kính chào. Ta là Frederick Hoàng đế La Mã Thần thánh, Vua của Đức, Ý, Burgundy và nhiều nơi khác. Ta tin rằng ngươi cũng sẽ cai trị lãnh thổ như ta: bằng sức mạnh.
Let us live in peace. = Hãy để chúng ta sống trong hòa bình.
No, of course not. = Không, dĩ nhiên là không rồi.
We have sent a diplomatic envoy to you. Treat them as you would treat me. = Chúng tôi đã gửi một sứ giả ngoại giao đến bạn. Hãy đối đãi với họ như cách bạn đối đãi với tôi.
Free Imperial Cities = Các Thành phố Đế chế Tự do
All cities can construct 1 additional District = Mọi thành phố có thể xây thêm 1 Quận

Gran Colombia = Đại Colombia
Simon Boli var = Simón Bolívar
Your tyranny, if unchecked, dooms the world to darkness, and for this reason I must declare war on you. = Sự bạo ngược của ngươi, nếu không được kiềm chế, sẽ đẩy thế giới vào bóng tối, và vì lý do đó ta phải tuyên chiến với ngươi.
Recourse to war is regrettable, but necessary, when dealing with vipers like you. = Phải dùng đến chiến tranh là điều đáng tiếc, nhưng cần thiết khi đối phó với loài rắn độc như các ngươi.
Everything I have done, I did for the nation of Gran Colombia. I remain a patriot to the very end. = Tất cả những gì tôi đã làm, tôi đều làm vì đất nước Đại Colombia. Tôi mãi là một người yêu nước cho đến phút cuối cùng.
I, President Simon Bolivar, welcome you to Gran Colombia. = Tôi, Tổng thống Simón Bolívar, chào mừng bạn đến với Đại Colombia.
Excellent! = Tuyệt hảo!
Tyrant!. = Đồ bạo chúa!.
I send to you a delegation of my finest horsemen. Will you let them in? = Tôi gửi đến bạn một phái đoàn gồm những kỵ sĩ cừ khôi nhất. Bạn sẽ mở cổng đón họ chứ?
Ejército Patriota = Quân đội Ái quốc (Ejército Patriota)

Greece = Hy Lạp
Gorgo = Gorgo
Now, we will test your strength! Prepare yourselves! = Bây giờ, chúng ta sẽ thử sức các ngươi! Hãy chuẩn bị đi!
You must not know: Spartans only return with their shield, or on it. = Ngươi hẳn không biết: người Sparta chỉ trở về với tấm khiên, hoặc nằm trên nó.
Ares has abandoned us. Sparta is defeated = Thần Ares đã ruồng bỏ chúng ta. Sparta đã bại trận
I am Gorgo, Queen of Sparta and leader of the Greeks. Who are you? What victories can you speak of? = Ta là Gorgo, Hoàng hậu xứ Sparta và lãnh tụ của người Hy Lạp. Ngươi là ai? Những chiến thắng nào ngươi có thể đem ra nói?
I will tell you of Sparta. = Ta sẽ kể cho ngươi nghe về Sparta.
Your words are meaningless compared to our deeds. = Lời nói của ngươi thật vô nghĩa so với hành động của chúng ta.
A Spartan delegation honors you with gifts. Accept them with honor. = Phái đoàn Sparta vinh danh bạn bằng những tặng phẩm. Hãy nhận lấy chúng trong vinh dự.
Plato's Republic = Nền Cộng hòa của Plato
Receive 1 additional Wildcard Policy Slot = Nhận thêm 1 Ô Chính sách Đa năng

Hungary = Hungary
Matthias Corvinus = Matthias Corvinus
Your insolence has provoked this war, and I shall be happy to lead the Black Army to victory over you. = Sự xấc xược của ngươi đã châm ngòi cho cuộc chiến này, và ta sẽ rất vui lòng dẫn dắt Đội quân Đen tiến tới chiến thắng trước ngươi.
Surely you had to know that one day there would be war between us. = Chắc chắn ngươi phải biết rằng một ngày nào đó sẽ có chiến tranh giữa chúng ta.
Today you wear the victor's laurels, but can you keep what you have taken? = Hôm nay ngươi đội vòng nguyệt quế của kẻ chiến thắng, nhưng liệu ngươi có giữ được những gì đã đoạt lấy không?
I am Matthias. I am King of Hungary, scourge of my foes, and defender of the faithful. Greetings. = Ta là Matthias. Ta là Vua của Hungary, nỗi khiếp sợ của kẻ thù, và người bảo vệ các tín đồ trung kiên. Xin chào.
I am glad to call you a friend = Tôi rất vui được gọi bạn là một người bạn
You are a lawless snake. = Ngươi là một con rắn vô pháp vô thiên.
I am sending you gifts worthy of a prince. = Ta gửi tặng ngươi những món quà xứng tầm một hoàng tử.
Pearl of the Danube = Viên ngọc sông Danube

Inca = Inca
Pachacuti = Pachacuti
Let there be war between us! I will wrestle your lands away, and rule your subjects with strength. = Giữa chúng ta sẽ có chiến tranh! Ta sẽ đoạt lấy đất đai của ngươi và cai trị thần dân của ngươi bằng sức mạnh.
Now is the time for war. Hear the stamp of our warriors—warriors with the hearts of the puma. = Bây giờ là thời khắc chiến tranh. Hãy nghe tiếng giậm chân của các chiến binh chúng ta—những chiến binh mang trái tim của báo sư tử puma.
How did you darken the sun? I ruled with diligence and mercy—see that you do so as well. = Làm sao ngươi có thể che khuất được mặt trời? Ta đã cai trị bằng sự mẫn cán và nhân từ—hãy nhớ cũng phải làm như vậy.
You stand before Pachacuti Inca Yupanqui. I accept your greeting and the service you can provide the Inca. = Ngươi đang đứng trước Pachacuti Inca Yupanqui. Ta nhận lời chào và sự phục vụ mà ngươi có thể mang lại cho đế chế Inca.
We are as the sun and moon. = Chúng ta như vầng thái dương và ánh trăng rằm.
I do not accept this. = Ta không chấp nhận điều này.
Receive these gifts. = Hãy nhận lấy những món quà này.
Mountains receive +2 Production, additional +2 Food, +1 Production for each adjacent Terrace Farm, and +1 Production after reaching the Industrial era. = Núi nhận +2 Sản xuất, thêm +2 Lương thực, +1 Sản xuất cho mỗi Ruộng bậc thang liền kề, và +1 Sản xuất sau khi đạt tới Thời kỳ Công nghiệp.

India = Ấn Độ
Gandhi = Gandhi
Indian = Ấn Độ
I can engage in this war without sacrificing morals. Don't ask me how; you wouldn't understand. = Tôi có thể tham gia vào cuộc chiến này mà không phải hy sinh đạo đức. Đừng hỏi tôi bằng cách nào; bạn sẽ không hiểu đâu.
My attempts to avoid violence have failed. An eye for an eye only makes the world blind. = Những nỗ lực tránh bạo lực của tôi đã thất bại. Một mắt đổi một mắt chỉ làm cho cả thế giới mù lòa.
You can chain me, you can torture me, you can even destroy this body, but you will never imprison my mind. = Bạn có thể xiềng xích tôi, bạn có thể tra tấn tôi, thậm chí hủy hoại thân xác này, nhưng bạn sẽ không bao giờ giam cầm được tâm trí tôi.
Hello, I am Mohandas Gandhi. My people call me Bapu, but please, call me friend. = Xin chào, tôi là Mohandas Gandhi. Người dân gọi tôi là Bapu, nhưng xin bạn hãy cứ gọi tôi là bạn bè.
You are too kind, my friend. = Bạn quá tốt bụng, người bạn của tôi.
You are untrustworthy. = Bạn không đáng tin cậy.
I have sent a trade delegation to you with gifts from our land. = Tôi đã cử một phái đoàn thương mại mang theo những món quà từ mảnh đất của chúng tôi đến gặp bạn.
Dharma = Pháp Dharma

Indonesia = Indonesia
Gitarja = Gitarja
Before this war ends, you will know the fury of a thousand ships. = Trước khi cuộc chiến này kết thúc, các ngươi sẽ biết đến cơn thịnh nộ của ngàn chiến thuyền.
Truly? Didn't you know my vengeance puts monsoons to shame? Soon you will. = Thật sao? Ngươi không biết sự báo thù của ta khiến cả gió mùa phải hổ thẹn ư? Ngươi sẽ sớm biết thôi.
The dream of Nusantara is lost to the turning tide. = Giấc mơ Nusantara đã tan theo con nước thủy triều.
I am Gitarja, Indonesia's queen and protector. Those who thought us weak litter the ocean floor. = Ta là Gitarja, nữ hoàng và người bảo hộ của Indonesia. Những kẻ từng nghĩ chúng ta yếu đuối giờ đang nằm dưới đáy đại dương.
I knew you had it in you. = Ta biết ngươi có bản lĩnh đó mà.
You are like the muck that spreads around ships in calm waters. = Ngươi như lớp bùn nhơ bám quanh thuyền trong vùng nước lặng.
Our delegation brings oncom spore cakes! = Phái đoàn của chúng tôi mang theo bánh lên men oncom truyền thống!
Great Nusantara = Đại Nusantara

Japan = Nhật Bản
Hojo Tokimune = Hojo Tokimune
I will not allow the Empire to suffer you any longer. The time has come to end this charade! = Ta sẽ không để Đế quốc phải chịu đựng các ngươi thêm nữa. Đã đến lúc kết thúc màn kịch này!
The Divine Wind will protect us and you will fall, like the others. = Thần Phong (Kamikaze) sẽ bảo vệ chúng ta và các ngươi sẽ gục ngã, như những kẻ khác.
Please end this dishonor to my family… to my people. = Xin hãy chấm dứt nỗi ô nhục này đối với gia tộc ta... đối với nhân dân ta.
Hello, I am Hojo Tokimune of Japan, a humble disciple of Bushido. = Xin kính chào, tôi là Hojo Tokimune của Nhật Bản, một đệ tử khiêm nhường của Võ Sĩ Đạo (Bushido).
Thank you, friend. = Cảm ơn bạn, người bạn của tôi.
A shame... = Thật đáng tiếc...
We have sent you a delegation with gifts, some of our greatest works. = Chúng tôi đã gửi đến bạn một phái đoàn cùng những tặng phẩm, một số kiệt tác vĩ đại nhất của chúng tôi.
Meiji Restoration = Minh Trị Duy Tân

The Khmer = Khmer
Jayavarman VII = Jayavarman VII
I will not allow the Empire to suffer you any longer. The time has come to end this charade! = Ta sẽ không để Đế quốc phải chịu đựng các ngươi thêm nữa. Đã đến lúc kết thúc màn kịch này!
War, then? Fools think fortune is on their side. Who will you blame when yours runs out? = Chiến tranh ư? Những kẻ ngu ngốc tưởng rằng vận may đang đứng về phía mình. Ngươi sẽ đổ lỗi cho ai khi vận may cạn kiệt?
One gains humility in defeat. I pray you are granted the most humility of all. = Người ta học được sự khiêm nhường trong thất bại. Ta cầu nguyện cho ngươi nhận được bài học khiêm nhường sâu sắc nhất.
I am Jayavarman VII, and the Khmer allow me to lead them. Their suffering is my suffering. = Ta là Jayavarman VII, và người Khmer để ta dẫn dắt họ. Nỗi đau của họ cũng chính là nỗi đau của ta.
Perhaps... yes. = Có lẽ... đúng vậy.
You defy Heaven with your harsh words! = Ngươi dám chống lại Ý Trời bằng những lời lẽ cay nghiệt đó!
Our delegation brings gits! = Phái đoàn của chúng tôi mang tặng phẩm tới!
Grand Barays = Các Hồ chứa Nước Baray Vĩ đại

Kongo = Kongo
Mvemba a Nzinga = Mvemba a Nzinga
We are no strangers to war. You have strayed from God's path, and now we will correct it. = Chúng tôi không xa lạ gì với chiến tranh. Bạn đã lầm đường lạc lối khỏi con đường của Chúa, và giờ chúng tôi sẽ uốn nắn lại.
Do you really think you can walk over us so easily? I will not let it happen. Not to Kongo - not to my people! = Bạn thực sự nghĩ có thể giẫm đạp lên chúng tôi dễ dàng thế sao? Tôi sẽ không để điều đó xảy ra. Không bao giờ đối với Kongo - không bao giờ đối với nhân dân tôi!
You are nothing but a glorified barbarian. Cruel, and ruthless. = Ngươi chẳng qua chỉ là một kẻ mọi rợ được tô vẽ. Độc ác và tàn nhẫn.
I am Mvemba a Nzinga and I greet you as a friend. I can see you are blessed by God. Are you here to share your enlightenment? = Tôi là Mvemba a Nzinga và tôi xin chào bạn như một người bạn. Tôi thấy bạn được Thượng đế ban phước. Bạn đến đây để sẻ chia sự khai sáng của mình chăng?
Thank you, my friend. = Cảm ơn bạn, người bạn của tôi.
That is unfortunate. = Thật đáng tiếc.
My trade delegation should be arriving soon! = Phái đoàn thương mại của tôi sẽ sớm tới nơi!

Korea = Triều Tiên
Seondeok = Seondeok (Thiện Đức Nữ Vương)
The stars predict your defeat. You cannot argue with the heavens. = Các vì tinh tú báo trước sự thất bại của các người. Ngươi không thể cãi lại Ý Trời.
Your defeat shall be swift … your people, forgotten. This I have foreseen. = Sự thất bại của ngươi sẽ đến chớp nhoáng... nhân dân ngươi sẽ bị lãng quên. Điều này ta đã thấy trước.
I foresaw my own end, but not that Korea would share my fate. = Ta đã thấy trước kết cục của chính mình, nhưng không ngờ Triều Tiên cũng phải chịu chung số phận.
I, Seondeok of Korea, acknowledge you. Our meeting was foreseen. = Ta, Seondeok xứ Triều Tiên, tiếp đón ngươi. Cuộc gặp gỡ của chúng ta đã được tiên báo từ trước.
How wonderful. = Thật tuyệt vời làm sao.
It is not to be, then. = Vậy thì đành chịu thôi.
Please accept our delicious gifts. = Xin hãy nhận những món quà ngon miệng của chúng tôi.
Three Kingdoms = Thời kỳ Tam Quốc
Seowons provide +1 Food towards every adjacent Farm and +1 Science towards every adjacent Mine. = Thư viện Seowon cộng 1 Lương thực cho mỗi Nông trại liền kề và 1 Khoa học cho mỗi Mỏ liền kề.

Macedon = Macedonia
Alexander = Alexander Đại đế
The armies of Greece await you with open arms! = Quân đội Hy Lạp đang dang rộng vòng tay chờ đón các ngươi!
Peace was never of all that much interest to me anyway. = Dù sao thì hòa bình cũng chưa bao giờ là điều làm ta hứng thú.
Just as quickly as it began, my long march finally comes to end. = Cuộc trường chinh của ta đã đến hồi kết thúc, nhanh chóng như lúc nó bắt đầu.
Greetings! I am Alexander of Macedon, the King and the Pharaoh, the undefeated General of Greece! Surely you've heard of me? = Kính chào! Ta là Alexander xứ Macedonia, Đức Vua và Pharaoh, Vị Tướng bất bại của Hy Lạp! Chắc chắn ngươi đã nghe danh ta chứ?
Come! = Đến đây!
I've dealt with traitors and deserters alike that were still more honorable than you! = Ta từng đối đầu với những kẻ phản bội và đào ngũ mà chúng vẫn còn danh dự hơn ngươi nhiều!
I've dispatched a trade delegation bearing gifts! I trust you'll greet my envoys warmly? = Ta đã phái một đoàn thương mại mang theo tặng phẩm! Ta tin ngươi sẽ tiếp đón sứ giả của ta nồng hậu chứ?
Hellenistic Fusion = Hòa trộn Văn hóa Hy Lạp (Hellenistic)
Conquering and annexing a city grants a free Technology and a free Civic = Chinh phục và sáp nhập một thành phố nhận miễn phí một Công nghệ và một Thể chế

Mali = Mali
Mansa Musa = Mansa Musa
Your transgressions are as deep as oceans. O God, grant that I may chastise this one! = Tội lỗi của các người sâu như đại dương. Hỡi Thượng đế, xin cho con được trừng trị kẻ này!
Enough! My forbearance ends here! We must have war between us, instead of a false peace. = Đủ rồi! Sự nhẫn nại của ta dừng lại ở đây! Giữa chúng ta phải có chiến tranh, thay vì một nền hòa bình giả dối.
Wealth is fleeting; learning is vanity. All I have done, O God, I did in your name. = Của cải là phù du; danh vọng là hư ảo. Tất cả những gì con đã làm, hỡi Thượng đế, con đều làm nhân danh Người.
I am Sultan Musa, lord of Mali, and—thanks be to God—a very, very rich man. I am pleased to meet you. = Ta là Sultan Musa, chúa tể xứ Mali, và—tạ ơn Thượng đế—là một người vô cùng, vô cùng giàu có. Ta rất vui được gặp bạn.
I am pleased. = Ta rất hài lòng.
Serpent! Tempter! Wretch! = Đồ rắn độc! Kẻ cám dỗ! Kẻ khốn nạn!
Please accept these simple gifts of one hundred porters carrying sacks of gold dust. = Xin hãy nhận những món quà mọn này từ một trăm phu khuân vác mang theo những bao bụi vàng.
Songs of the Jeli = Bài ca của người kể chuyện Jeli

The Maori = Maori
Kupi = Kupe
You choose death! Your people wail and moan! The pillars of your houses shake, all your lands are shaking! = Các người đã chọn cái chết! Thần dân của các người sẽ than khóc rên rỉ! Trụ cột nhà cửa của các người đang rung chuyển, toàn bộ đất đai của các người đang rung chuyển!
Look at the big civ leader over there with the war declaration! Great job, mate. Really shows off how hard you are. = Nhìn kìa, vị lãnh đạo nền văn minh lớn đằng kia vừa tuyên chiến! Giỏi lắm, anh bạn. Thể hiện bản lĩnh dữ dội ghê ha.
I have done my utmost, but your strength was greater. My heart, at least, will beat undefeated. = Tôi đã dốc hết sức mình, nhưng sức mạnh của bạn lớn hơn. Ít nhất thì trái tim tôi sẽ đập mà không bao giờ bị khuất phục.
I am Kupe the navigator, and you approach the place of the Maori. Will you tell me about yourself? = Tôi là Kupe nhà hàng hải, và bạn đang tiến vào vùng đất của người Maori. Bạn có muốn kể cho tôi nghe về bản thân mình không?
Yeah you're alright. = Được đó, bạn ổn đấy.
Yeah nah. = Thôi khỏi đi.
Here are gifts of pounamu, korowai cloaks and huhu grubs. = Đây là những món quà ngọc bích pounamu, áo choàng korowai và ấu trùng huhu béo ngậy.
Mana = Sức mạnh Siêu nhiên Mana

The Mapuche = Mapuche
Lautaro = Lautaro
It comes to war. Mapuche shall use your own weapons against you! = Chiến tranh đã tới. Người Mapuche sẽ dùng chính vũ khí của các ngươi để chống lại các ngươi!
I knew you could not be trusted! We have long prepared for this war. Have you? = Ta biết ngay ngươi không thể tin tưởng được! Chúng ta đã chuẩn bị từ lâu cho cuộc chiến này. Còn ngươi thì sao?
We resisted to the last, but it was too late … too late. = Chúng ta đã kháng cự đến cùng, nhưng đã quá muộn... quá muộn rồi.
I am Lautaro, the Swift Hawk. Mapuche honor me with respect. Will I see the same from you? = Ta là Lautaro, Chim Ưng Thần Tốc. Người Mapuche tôn kính ta bằng sự kính trọng. Liệu ta có thấy điều tương tự từ ngươi không?
You honor Mapuche with this. = Ngươi tôn vinh người Mapuche với điều này.
You offend me. = Ngươi xúc phạm ta.
Mapuche send gifts. Please accept these. = Người Mapuche gửi tặng phẩm. Xin hãy nhận lấy.
Toquime. = Thủ lĩnh Toqui.

The Maya = Maya
Lady Six Sky = Lady Six Sky (Bà Chúa Sáu Bầu Trời)
You are unworthy of rulership. I will take your cities and your people, and rule them for you. = Ngươi không xứng đáng trị vì. Ta sẽ đoạt lấy các thành phố và thần dân của ngươi, rồi cai quản thay cho ngươi.
I will not allow you to remain in power any longer. You have offended me for too long! = Ta sẽ không để ngươi tiếp tục nắm quyền thêm nữa. Ngươi đã xúc phạm ta quá lâu rồi!
The cycle of the Maya ends. But the end of your time will come, too. I pray it will be soon. = Chu kỳ của người Maya đã khép lại. Nhưng ngày tàn của ngươi rồi cũng sẽ tới. Ta cầu nguyện ngày đó sẽ đến thật sớm.
You are in the presence of Lady Six Sky, priestess and warrior, queen of the Maya. Greetings. = Ngươi đang diện kiến Lady Six Sky, nữ tư tế và chiến binh, nữ hoàng của người Maya. Xin chào.
We shine together in the sky, you and I. = Chúng ta cùng tỏa sáng trên bầu trời, ngươi và ta.
I must have misjudged you. = Ta hẳn đã đánh giá sai về ngươi.
My envoys bring to you gifts. Will you let them in? = Các sứ giả của ta mang tặng phẩm đến cho ngươi. Ngươi có cho họ vào không?
Mayab = Vùng đất Mayab

Mongolia = Mông Cổ
Genghis Khan = Thành Cát Tư Hãn
You stand in the way of my armies. Soon, you shall fall before them. = Ngươi đang cản đường vó ngựa của đại quân ta. Chẳng mấy chốc, ngươi sẽ ngã gục trước họ.
No more words. Today, Mongolia charges toward your defeat. = Không cần nói nhiều nữa. Hôm nay, quân Mông Cổ sẽ xông lên nghiền nát ngươi.
You have hobbled the Mongolian clans. My respect for you nearly matches the loathing. = Ngươi đã ghìm cương được các bộ tộc Mông Cổ. Sự tôn trọng của ta dành cho ngươi gần ngang bằng với nỗi căm ghét.
I am Genghis Khan. Before me lie future Mongolian lands. Behind me is the only cavalry that matters. = Ta là Thành Cát Tư Hãn. Trước mắt ta là những vùng đất tương lai của Mông Cổ. Sau lưng ta là lực lượng kỵ binh duy nhất xứng tầm.
Mongolia will appreciate this. = Mông Cổ sẽ ghi nhận điều này.
Don't assume Mongolia admires you that much. = Đừng tưởng Mông Cổ ngưỡng mộ ngươi đến thế.
I am sending you gifts—surplus horses, a youth's bow, and airag to fortify you. Drink up! = Ta gửi tặng ngươi những món quà—ngựa chiến dôi dư, một cây cung của dũng sĩ trẻ, và rượu sữa ngựa airag để bồi bổ. Uống cạn đi!
Land units receive +10% Combat Strength when on a Road, +10% Combat Strength for Mounted units = Đơn vị bộ binh nhận +10% Sức mạnh Chiến đấu khi ở trên Đường sá, +10% Sức mạnh Chiến đấu cho đơn vị Kỵ binh

Norway = Na Uy
Harald Hardrada = Harald Hardrada
Now comes a storm you cannot escape. You can only hope for a quick death. = Giờ đây cơn bão tố đang kéo tới mà ngươi không thể trốn thoát. Ngươi chỉ có thể hy vọng vào một cái chết nhanh chóng.
This will make a great saga! The skalds will sing of my valor! = Điều này sẽ làm nên một bản trường ca vĩ đại! Các thi sĩ skald sẽ ca ngợi lòng quả cảm của ta!
So, I will join the einherjar in Valhalla and feast, while you toil away here. = Vậy là ta sẽ gia nhập cùng các chiến binh einherjar ở Valhalla để mở tiệc, trong khi ngươi vẫn phải nhọc nhằn nơi trần thế này.
Harald Sigurdsson stands before you: a Viking unlike any the seas and lands have ever known. Hah, are you afraid? = Harald Sigurdsson đang đứng trước mặt ngươi: một chiến binh Viking chưa từng có vùng biển hay đất liền nào từng biết tới. Haha, ngươi có sợ không?
Friend? Yes, I am a friend. = Bạn bè ư? Phải, ta là một người bạn.
No, not for all the treasure in Asgard. = Không, dẫu có đổi lấy tất cả kho báu ở Asgard ta cũng không chịu.
I have sent you traders with gifts! = Ta đã cử các thương nhân mang theo tặng phẩm đến gặp ngươi!
Knarr = Thuyền buôn Knarr

The Netherlands = Hà Lan
Wilhelmina = Wilhelmina
The Netherlands does not fear you. When we defeat you, we will be stronger than ever. = Hà Lan không hề sợ các người. Khi đánh bại các người, chúng tôi sẽ mạnh mẽ hơn bao giờ hết.
Your treacherous aggression shall not succeed. The Netherlands will endure! = Hành vi xâm lược bội bạc của các người sẽ không thành công. Hà Lan sẽ kiên cường đứng vững!
With God's help, may the Netherlands one day reclaim its territory. = Nhờ ơn Thượng đế giúp đỡ, cầu mong một ngày nào đó Hà Lan sẽ giành lại lãnh thổ của mình.
I am Wilhelmina, Queen of the Netherlands. It is my great pleasure to finally meet you. = Tôi là Wilhelmina, Nữ hoàng Hà Lan. Tôi rất vinh hạnh cuối cùng cũng được gặp bạn.
May our relationship be long and prosperous. = Chúc cho mối quan hệ của chúng ta bền lâu và phồn thịnh.
It is our fervent desire to tell you just how awful we find you. = Chúng tôi vô cùng khao khát được nói cho bạn biết rằng chúng tôi thấy bạn tồi tệ đến mức nào.
The Netherlands send you gifts of greeting. = Hà Lan gửi tặng bạn những món quà chào mừng.
Grote Rivieren = Những Dòng sông Lớn (Grote Rivieren)

Nubia = Nubia
Amanitore = Amanitore
We have arrows, finely honed. We shall deliver them freely to your throat. = Chúng ta có những mũi tên được mài giũa sắc bén. Chúng ta sẽ tặng không chúng vào cổ họng các ngươi.
As predicted, you know only how to take. Come, then—choose the manner of your defeat. = Đúng như dự đoán, các ngươi chỉ biết cướp đoạt. Hãy tới đây—chọn cách mà các ngươi muốn bị đánh bại.
Though Nubia declines, our pyramids shall remain long after your plans fall to ruin. = Dẫu Nubia suy tàn, các kim tự tháp của chúng ta vẫn sẽ đứng vững rất lâu sau khi các kế hoạch của ngươi biến thành tro bụi.
I am Amanitore of Nubia. All are welcome in our magnificent cities—provided they come as friends. = Ta là Amanitore xứ Nubia. Mọi người đều được chào đón tại các thành phố tráng lệ của chúng ta—miễn là họ đến với tư cách bạn bè.
How gracious of you. = Bạn thật hòa nhã.
With you, I always expect the worst. = Với bạn, tôi luôn lường trước điều tồi tệ nhất.
Our delegation brings goodwill! = Phái đoàn của chúng tôi mang theo thiện chí!
Ta-Seti = Mảnh đất Cung tên Ta-Seti

The Ottomans = Ottoman
Suleiman = Suleiman
Your continued insolence and failure to recognize any preeminence leads us to war. = Sự xấc xược liên tục và không chịu công nhận vị thế tối thượng của bạn đã đẩy chúng ta vào chiến tranh.
Good. The world shall witness the incontestable might of my armies and the glory of the Empire. = Tốt lắm. Thế giới sẽ chứng kiến sức mạnh không thể chối cãi của quân đội ta và vinh quang của Đế chế.
Ruin! Ruin! Istanbul becomes Iram of the Pillars, remembered only by the melancholy poets. = Điêu tàn! Hoang tàn! Istanbul biến thành Iram của những cột trụ phế tích, chỉ còn được nhớ đến bởi những thi sĩ sầu muộn.
From the magnificence of Topkapi, I, Suleiman, Kayser-I Rum, bestow upon you my welcome. = Từ sự tráng lệ của cung điện Topkapi, ta, Suleiman, Hoàng đế Kayser-i Rum, gửi đến bạn lời chào mừng.
Great is my charity! It will be done. = Lòng từ thiện của ta thật lớn lao! Điều đó sẽ được thực hiện.
You are not my equal, merely an ardent admirer. = Ngươi không ngang hàng với ta, chỉ là một kẻ ngưỡng mộ cuồng nhiệt mà thôi.
I send you gifts of rubies, emeralds, goldwork, and many delicacies! = Ta gửi tặng ngươi hồng ngọc, ngọc lục bảo, đồ chạm vàng và muôn vàn mỹ vị!
Great Turkish Bombard = Đại Pháo Thổ Nhĩ Kỳ

Persia = Ba Tư
Cyrus = Cyrus Đại đế
It is time I show your people how they might fare under a competent ruler. = Đã đến lúc ta cho người dân của ngươi thấy họ sẽ sống ra sao dưới trướng một vị minh quân tài năng.
Have you not heard the tales? The storied might of my armies? See for yourself. = Ngươi chưa từng nghe những câu chuyện kể sao? Sức mạnh huyền thoại của quân đội ta? Hãy tự mình chứng kiến đi.
So rarely have I seen this side of war. = Hiếm khi nào ta thấy mặt này của chiến tranh.
You stand before the great Cyrus of Persia. I'm sure we'll be become fast friends, at least for the time being. = Ngươi đang đứng trước Cyrus Đại đế của Ba Tư. Ta tin chúng ta sẽ sớm trở thành bạn thân, ít nhất là vào thời điểm này.
Good day to you! = Chúc bạn một ngày tốt lành!
Ahh... you... = À... là ngươi...
I've sent a trade emissary to your kingdom with gifts. I'm sure you will treat my envoy with the same respect you've shown me? = Ta đã cử một phái viên thương mại mang theo tặng phẩm tới vương quốc của bạn. Ta tin bạn sẽ đối đãi với sứ giả bằng sự tôn trọng như đã dành cho ta chứ?
Sartrapies = Chế độ Tổng trấn Satrapies

Phoenicia = Phoenicia
Dido = Dido
Now we have war between us. Look to the seas——already the horizon is crowded with the sails of my fleets. = Bây giờ giữa chúng ta là chiến tranh. Hãy nhìn ra biển cả——đường chân trời đã rợp bóng những cánh buồm hạm đội của ta rồi.
War? Are you a fool? Your cities will suffer the fate of Epirus and Saguntum. = Chiến tranh ư? Ngươi là kẻ ngu ngốc sao? Các thành phố của ngươi sẽ phải chịu chung số phận của Epirus và Saguntum.
Do not glory in your conquest. One day you may see your capital bathed in flame. = Đừng vội đắc thắng trong cuộc chinh phục của ngươi. Sẽ có ngày ngươi phải chứng kiến thủ đô của chính mình chìm trong biển lửa.
I, Dido, queen and mother of Carthage, greet you on behalf of the Phoenicians. = Ta, Dido, nữ hoàng và người mẹ của Carthage, xin gửi lời chào đến ngươi nhân danh người Phoenicia.
Find rest among us. = Hãy tìm kiếm sự an nghỉ giữa chúng ta.
You flatter yourself. = Ngươi đang tự huyễn hoặc bản thân rồi.
Accept these gifts—a mere taste of the wealth of Phoenicia. = Hãy nhận những món quà này—một hương vị nhỏ bé từ sự giàu có của Phoenicia.
Founder of Carthage = Người Sáng lập Carthage

Poland = Ba Lan
Jadwiga = Jadwiga
I must protect the interests of Poland. Surrender quickly so that this may end without bloodshed. = Ta phải bảo vệ lợi ích của Ba Lan. Hãy nhanh chóng đầu hàng để kết thúc điều này mà không đổ máu.
So, you show your true nature: a serpent lying in the grass… easily trampled. = Thì ra ngươi đã để lộ bản chất thật: một con rắn độc ẩn mình trong cỏ... dễ dàng bị giẫm nát.
No, I am not ready to leave God’s service. I am just beginning his good work! = Không, ta chưa sẵn sàng từ bỏ việc phụng sự Thượng đế. Ta mới chỉ bắt đầu công việc thiện lành của Người!
A meeting blessed by God, I am sure. I am Jadwiga the King of Greater Poland. Yes, a king. = Một cuộc gặp gỡ được Thượng đế ban phước, ta tin chắc vậy. Ta là Jadwiga, Đức Vua của Đại Ba Lan. Phải, một vị vua.
Very good. = Rất tốt.
Evil cannot stay hidden for long. = Cái ác không thể ẩn giấu được lâu.
I have sent a trade delegation to you with gifts of pisanki. They have been blessed. = Ta đã cử một phái đoàn thương mại mang theo những quả trứng phục sinh pisanki làm quà tặng. Chúng đã được ban phước.
Golden Liberty = Tự do Hoàng kim (Golden Liberty)

Rome = La Mã
Trajan = Trajan
Prepare yourselves for war. Our armies will stop at nothing; our navies will swarm your shores, for the glory of Rome. = Hãy chuẩn bị tinh thần cho chiến tranh. Quân đội của chúng ta sẽ không dừng bước trước bất cứ điều gì; hải quân của chúng ta sẽ tràn ngập bờ biển của các ngươi, vì vinh quang của La Mã.
