//Comments
'Yet in this captious and intenible sieve, I still pour in the waters of my love. And lack not to lose still: thus, Indian-like, religious in mine error, I adore. The sun, that looks upon his worshipper, but knows of him no more.' - William Shakespeare = 'Dẫu trong chiếc sàng hay bắt bẻ và không giữ được nước này, ta vẫn rót vào đó dòng nước của tình yêu. Và chẳng ngại tiếp tục đánh mất: cứ thế, như người Ấn Độ, sùng kính trong sai lầm của mình, ta tôn thờ. Mặt trời, đấng nhìn xuống kẻ thờ phụng ngài, nhưng chẳng còn biết gì về người ấy nữa.' - William Shakespeare
'The ascent to the highest story is by stairs, and at their side are water engines, by means of which persons, appointed expressly for the purpose, are continually employed in raising water from the Euphrates into the garden.' –Strabo = 'Đường lên tầng cao nhất là bằng các bậc thang, và bên cạnh là các cỗ máy nước, qua đó những người được chỉ định riêng biệt liên tục làm việc để dẫn nước từ sông Euphrates lên khu vườn.' – Strabo
'I sprang upon the swift ship in the form of a dolphin, pray to me as Apollo Delphinius; also the altar itself shall be called Delphinius and overlooked forever.' –Homer = 'Ta đã nhảy lên con tàu lướt nhanh dưới hình hài một chú cá heo, hãy cầu nguyện với ta như Apollo Delphinius; bàn thờ cũng sẽ được gọi là Delphinius và được trông nom mãi mãi.' – Homer
'Can you imagine trying to talk six hundred people into helping you drag a fifty-ton stone eighteen miles across the countryside and muscle it into an upright position, and then saying, 'Right, lads! Another twenty like that...and then we can party!' –Bill Bryson = 'Bạn có tưởng tượng nổi việc thuyết phục sáu trăm người giúp bạn kéo một tảng đá năm mươi tấn qua mười tám dặm đồng quê rồi dùng sức dựng đứng nó lên, và sau đó nói: 'Được rồi các chàng trai! Thêm hai mươi khối như thế nữa... rồi chúng ta mở tiệc!' – Bill Bryson
'From the height of these pyramids, forty centuries look down on us.' –Napolean Boneparte = 'Từ trên đỉnh những kim tự tháp này, bốn mươi thế kỷ đang dõi nhìn chúng ta.' – Napoléon Bonaparte
'When I saw the house of Artemis that mounted to the clouds, those other marvels lost their brilliancy, and I said, 'Lo, apart from Olympus, the Sun never looked on aught so grand.' –Antipater of Sidon = 'Khi ta nhìn thấy đền thờ Artemis vươn tới tận trời mây, những kỳ quan khác đều mất đi vẻ rực rỡ, và ta thốt lên: 'Kìa, ngoại trừ đỉnh Olympus, Mặt trời chưa từng chiếu rọi một công trình nào tráng lệ đến thế.' – Antipater xứ Sidon
'My ancestor Darius made this Apadana, but it was burnt down. By the grace of Ahuramazda, Anahita, and Mithra, I reconstructed this Apadana.' –Artaxerxes II = 'Tổ phụ ta là Darius đã xây dựng Apadana này, nhưng nó đã bị thiêu rụi. Nhờ ân điển của Ahuramazda, Anahita và Mithra, ta đã tái thiết Apadana này.' – Artaxerxes II
'While the Colosseum stands, Rome shall stand; when the Colosseum falls, Rome shall fall; when Rome falls, the world shall fall.' –Saint Bede = 'Khi Đấu trường La Mã còn đứng vững, Roma sẽ đứng vững; khi Đấu trường La Mã sụp đổ, Roma sẽ sụp đổ; khi Roma sụp đổ, cả thế giới sẽ sụp đổ.' – Thánh Bê-đa
'At Rhodes was set up a Colossus of seventy cubits high, representing the Sun. The artist expended as much bronze on it as seemed likely to create a dearth in the mines.' –Philo of Byzantium = 'Tại Rhodes, một bức tượng Khổng lồ cao bảy mươi cubit đã được dựng lên để đại diện cho Thần Mặt trời. Người nghệ sĩ đã tiêu tốn nhiều đồng đến mức tưởng như làm cạn kiệt các mỏ khai khoáng.' – Philo xứ Byzantium
'We can roam the bloated stacks of the Library of Alexandria, where all imagination and knowledge are assembled, we can recognize in its destruction the warning that all we gather will be lost.' –Lucian of Samosata = 'Chúng ta có thể dạo bước giữa các giá sách ngập tràn của Thư viện Alexandria, nơi quy tụ mọi trí tưởng tượng và tri thức, và nhận ra trong sự hủy diệt của nó lời cảnh báo rằng mọi thứ ta gom góp rồi sẽ tiêu tan.' – Lucian xứ Samosata
'This lighthouse was the cynosure of all eyes.' –Henry David Thoreau = 'Ngọn hải đăng này từng là tâm điểm thu hút mọi ánh nhìn.' – Henry David Thoreau
'At the south-west corner a large perpendicular mass of sandstone has become separated by a deep fissure from the body of the mountain … it has all the appearance of a colossal statue.' –E. A. Wallis Budge = 'Ở góc tây nam, một khối sa thạch thẳng đứng khổng lồ đã bị tách ra bởi một khe nứt sâu khỏi thân núi... nó mang hình dáng của một bức tượng khổng lồ.' – E. A. Wallis Budge
'T...Eagles fly, the turret rounds, and seem to flout the sky; They eye those walls now crumbling in decay, and scare from quiet rest their destined prey.' –Henry David Thoreau = 'Đại bàng bay lượn quanh những ngọn tháp tròn, dường như thách thức cả bầu trời; Chúng dõi nhìn những bức tường đang sụp đổ mục nát, và xua tan sự bình yên của con mồi.' – Henry David Thoreau
'In a dusty, bustling corner of the Indian state of Bihar, there is a magical place that one might think of as the hub of Buddhism.' – Visitor's Guide, Bodh Gaya = 'Ở một góc bụi bặm, nhộn nhịp của bang Bihar thuộc Ấn Độ, có một nơi huyền diệu mà người ta coi là trung tâm của Phật giáo.' – Cẩm nang Du khách, Bồ Đề Đạo Tràng
'A vast tomb lies over me in Halicarnassus, of such dimensions, of such exquisite beauty as no other shade can boast.' –Lucian of Samosata = 'Một lăng mộ rộng lớn nằm trên thân ta ở Halicarnassus, với kích thước và vẻ đẹp tinh xảo mà không linh hồn nào khác có thể sánh bằng.' – Lucian xứ Samosata
'Petra is a brilliant display of man's artistry in turning barren rock into majestic wonder.' –Edward Dawson = 'Petra là minh chứng rực rỡ cho tài năng nghệ thuật của con người trong việc biến đá cằn sỏi đá thành kỳ quan hùng vĩ.' – Edward Dawson
'Upon the head of the god was an olive crown; in his right hand he bore a winged figure of Victory.' –Samuel Augustus Mitchell = 'Trên đầu vị thần đội vương miện cành ô liu; tay phải người nâng niu một bức tượng Nữ thần Chiến thắng có cánh.' – Samuel Augustus Mitchell
'There were seven wonders in the world, and the discovery of the Terracotta Army, we may say, is the eighth miracle of the world.' –Jacques Chirac = 'Thế giới từng có bảy kỳ quan, và sự phát hiện Đội quân Đất nung, có thể nói, chính là phép màu thứ tám của thế giới.' – Jacques Chirac
'Everything here appears calculated to inspire kind and happy feelings, for everything is delicate and beautiful.' –Washington Irving = 'Mọi thứ ở đây dường như được tạo ra để khơi gợi những cảm xúc dịu dàng và hạnh phúc, bởi tất cả đều thanh tao và tuyệt mỹ.' – Washington Irving
'The temple is surrounded by a moat, and access is by a single bridge, protected by two stone tigers so grand and fearsome as to strike terror into the visitor.' –Diogo do Couto = 'Ngôi đền được bao quanh bởi một hào nước, lối vào duy nhất là một cây cầu, được bảo vệ bởi hai con hổ đá uy nghi và hung dữ đến mức gieo rắc nỗi kinh hoàng cho người ghé thăm.' – Diogo do Couto
'The Great Ballcourt is also very impressive. I would like to have seen them play a game, although it sounds like the end was pretty violent. I think it was safer to be a spectator.' –Isla Deb = 'Sân bóng lớn cũng rất ấn tượng. Tôi ước gì được xem họ chơi một trận đấu, mặc dù kết cục nghe có vẻ khá bạo lực. Tôi nghĩ làm khán giả thì an toàn hơn.' – Isla Deb
'It is a beautiful and important monument and an international, intercultural treasure...Unless and until it can be shared by both religions in harmony--which would be a grand idea--it should remain a secular building honoring both religions who have made it beautiful.' –Ljubo Vujovic = 'Đó là một tượng đài tươi đẹp, quan trọng và là kho tàng liên văn hóa quốc tế... Trừ khi và cho đến khi nó có thể được cả hai tôn giáo chia sẻ trong hòa hợp, nó nên tiếp tục là một công trình tôn vinh cả hai tôn giáo đã làm nên vẻ đẹp của nó.' – Ljubo Vujovic
'But the wrath of Huizlopochtli was great, and as the sacrifice passed each of the four rooms dedicated to the sun god, the sun disappeared or reappeared in the sky.' –Fray Diego Durán = 'Nhưng cơn thịnh nộ của Huitzilopochtli là vô cùng lớn, và khi vật tế đi qua mỗi gian phòng trong bốn gian thờ thần mặt trời, mặt trời lại biến mất hoặc hiện ra trên bầu trời.' – Thầy tu Diego Durán
'Kilwa is one of the most beautifully built cities in the world; the houses there are entirely made of wood, their rooftops out of rope grass, and it rains with great vigour.' –Ibn Battuta = 'Kilwa là một trong những thành phố được xây dựng đẹp nhất thế giới; nhà cửa ở đó hoàn toàn bằng gỗ, mái lợp bằng cỏ bện, và mưa rơi rất dồi dào.' – Ibn Battuta
'O ye who tread the Narrow Way, by Tophet-flare to Judgment Day, be gentle when ‘the heathen’ pray, to Buddha at Kamakura!' –Rudyard Kipling = 'Hỡi những người bước đi trên Con Đường Hẹp, hãy khoan dung khi những người ngoại đạo cầu nguyện trước tượng Phật tại Kamakura!' – Rudyard Kipling
'We greet you, Devi Meenakshi, she who shines like a thousand-million suns, adorned with bracelets and garlands... She who is auspicious, she who embodies existence. I always bow to you, whose compassion is an ocean.' – Adi Shankara = 'Chúng con kính chào Người, Nữ thần Meenakshi, Người tỏa sáng như vạn triệu mặt trời, đeo vòng tay và tràng hoa... Con luôn cúi đầu trước Người, Đấng có lòng từ bi bao la như biển cả.' – Adi Shankara
Church and State, Soul and Body, God and Man, are all one at Mont Saint Michel, and the business of all is to fight, each in his own way, or to stand guard for each other.' – Henry Adams = Giáo hội và Nhà nước, Linh hồn và Thể xác, Thiên Chúa và Con người, tất cả hòa làm một tại Mont Saint-Michel, và phận sự của tất cả là chiến đấu, hoặc đứng canh giữ cho nhau.' – Henry Adams
'Scholars are the heirs of the prophets, for the prophets did not leave behind a legacy of wealth but that of knowledge.' –Musnad al-Bazzar 10/68 = 'Các học giả là những người thừa kế của các nhà tiên tri, bởi các nhà tiên tri không để lại di sản của cải mà để lại di sản tri thức.' – Musnad al-Bazzar 10/68
'All other lands found on the western side of the boundary shall belong to the King and Queen of Castille—and their successors.' –Treaty of Tordesillas = 'Tất cả những vùng đất khác được tìm thấy ở phía tây của ranh giới sẽ thuộc về Vua và Hoàng hậu xứ Castille—và những người kế vị của họ.' – Hiệp ước Tordesillas
'The whole palace complex is built along a central axis, the axis of the world, everything in the four directions suspend from this central point represented by these palaces.' –Jeffrey Riegel = 'Toàn bộ quần thể cung điện được xây dựng dọc theo trục trung tâm, trục của thế giới, mọi thứ ở bốn phương tám hướng đều quy về điểm trung tâm này.' – Jeffrey Riegel
'King Solomon gave the Queen of Sheba all she desired and asked for; besides what he had given her out of his royal bounty. So she turned and went to her own country, she and her servants.' –1 Kings, 10:13 = 'Vua Solomon ban cho Nữ hoàng Sheba mọi điều nàng ao ước và cầu xin; ngoài những tặng phẩm từ lòng hào hiệp hoàng gia của ngài. Rồi nàng cùng các bề tôi trở về xứ sở của mình.' – 1 Các Vua 10:13
'The first time I stepped onto the rooftop of the Potala Palace, I felt, as never before or since, as if I were stepping onto the rooftop of my being; onto some dimension of consciousness that I'd never visited before.' –Pico Iyer = 'Lần đầu tiên bước lên mái Cung điện Potala, tôi cảm thấy như đang bước lên tầng cao nhất của bản ngã mình; bước vào một chiều không gian ý thức mà tôi chưa từng tới.' – Pico Iyer
'One had a twisted design, red, on a green ground; another, all prickly angles, yellow and black; a third was ornamented with scales of blue and crimson; a fourth was in quarters like a melon.' –Katharine Blanche Guthrie = 'Một tòa có thiết kế xoắn ốc màu đỏ trên nền xanh; tòa khác góc cạnh sắc nhọn màu vàng và đen; tòa thứ ba trang trí vảy xanh lam và đỏ thẫm; tòa thứ tư chia múi như quả dưa.' – Katharine Blanche Guthrie
'Did you ever build a castle in the air? Here is one, brought down to earth and fixed for the wonder of ages.' – Bayard Taylor = 'Bạn đã từng xây lâu đài trên cát chưa? Đây là một tòa lâu đài được mang xuống mặt đất và dựng nên thành kỳ quan của muôn đời.' – Bayard Taylor
No vessel could pass these guns without being seriously assailed.' – Laure Junot Abrantes = Không con tàu nào có thể đi qua những họng pháo này mà không bị công kích dữ dội.' – Laure Junot Abrantes
'The Commonwealth of Venice in their armory have this inscription: 'Happy is that city which in time of peace thinks of war'.' –Robert Burton = 'Kho vũ khí của Cộng hòa Venice có khắc dòng chữ: 'Hạnh phúc thay cho thành phố nào biết nghĩ đến chiến tranh trong thời bình'.' – Robert Burton
'Here at our sea-washed, sunset gates shall stand a mighty woman with a torch, whose flame is the imprisoned lightning.' – Emma Lazarus = 'Nơi cổng hoàng hôn lộng gió biển khơi sẽ đứng sừng sững một người phụ nữ quyền uy cầm ngọn đuốc, với ngọn lửa là tia chớp bị giam giữ.' – Emma Lazarus
'The industrial heart of Germany practically stopped beating. Hardly anyone worked, hardly anything ran. The population of the Ruhr area...had to be supported by the rest of the country.' –Adam Fergusson = 'Trái tim công nghiệp của nước Đức gần như ngừng đập. Hầu như không ai làm việc, hầu như không có gì vận hành. Cư dân vùng Ruhr... phải nhờ cả nước chu cấp.' – Adam Fergusson
'Therefore will not we fear, though the earth be removed, and though the mountains be carried into the midst of the sea; Though the waters thereof roar and be troubled, though the mountains shake with the swelling thereof.' – Psalms 46:2-3 = 'Bởi vậy chúng ta sẽ chẳng sợ dẫu đất đổi dời, dẫu núi lay chuyển vào lòng biển; dẫu nước biển gầm thét và sủi bọt, dẫu các núi rung chuyển vì biển dậy sóng.' – Thi Thiên 46:2-3
'The clever men at Oxford...know all that there is to be knowed. But they none of them know one half as much...As intelligent Mr. Toad!' –Kenneth Grahame = 'Những học giả thông thái ở Oxford... biết tất cả những gì có thể biết. Nhưng không ai trong số họ biết được một nửa... so với Ngài Cóc thông minh!' – Kenneth Grahame
'With self-government is freedom, and with freedom is justice and patriotism.'– Lajos Kossuth = 'Tự trị mang lại tự do, và tự do mang lại công lý cùng lòng yêu nước.' – Lajos Kossuth
'Museums are on the front lines of the fight for culture, of good with evil--in any case, of the fight against platitudes and primitiveness.' –Mikhail Piotrovsky, Director of the State Hermitage = 'Bảo tàng nằm ở tiền tuyến của cuộc chiến vì văn hóa, giữa cái thiện và cái ác--trong mọi trường hợp, đó là cuộc chiến chống lại sự tầm thường và thô thiển.' – Mikhail Piotrovsky, Giám đốc Bảo tàng Hermitage
'Bolshoi Ballet is a universe of the imagination, a place of magic and enchantment, beauty and romance, its many worlds vibrate with graceful dancers, glorious music, and sumptuous costumes.' –Trudy Garfunkel = 'Ba-lê Bolshoi là một vũ trụ của trí tưởng tượng, một nơi kỳ diệu và mê hoặc, vẻ đẹp và lãng mạn; các thế giới của nó rung động cùng những vũ công uyển chuyển, âm nhạc huy hoàng và trang phục lộng lẫy.' – Trudy Garfunkel
'Don't watch the big clock, do what it does: Keep going.' –Sam Levenson = 'Đừng nhìn chiếc đồng hồ lớn, hãy làm những gì nó làm: Tiếp tục tiến bước.' – Sam Levenson
'I ought to be jealous of the tower. She is more famous than I am.' –Gustave Eiffel = 'Tôi hẳn phải ghen tị với ngọn tháp. Nàng nổi tiếng hơn cả tôi.' – Gustave Eiffel
'Thus, the sculpture serves to give people one thought--'Everything is in God's hands.'' –Sergey Semenov = 'Bởi vậy, bức tượng mang đến cho con người một suy nghĩ--'Mọi thứ đều nằm trong tay Chúa.'' – Sergey Semenov
'There's no business like show business.' –Irving Berlin, Annie Get Your Gun = 'Không ngành kinh doanh nào hào nhoáng như ngành giải trí biểu diễn.' – Irving Berlin, Annie Get Your Gun
'Down through its history, only three people have managed to silence the Maracana: the Pope, Frank Sinatra, and me.' – Alcides Ghiggia, Uruguayan soccer player = 'Trong suốt chiều dài lịch sử, chỉ có ba người từng khiến sân Maracanã phải câm lặng: Giáo hoàng, Frank Sinatra, và tôi.' – Alcides Ghiggia, cầu thủ bóng đá Uruguay
'Heaven is under our feet as well as over our heads.' –Henry David Thoreau = 'Thiên đường ở ngay dưới chân chúng ta cũng như ở ngay trên đầu chúng ta.' – Henry David Thoreau
'For scientific leadership, give me Scott; for swift and efficient travel, Amundsen.' –Sir Raymond Priestley = 'Để lãnh đạo khoa học, hãy cho tôi Scott; để đi lại nhanh chóng và hiệu quả, hãy cho tôi Amundsen.' – Ngài Raymond Priestley
'An opera begins long before the curtain goes up and ends long after it has come down. It starts in my imagination, it becomes my life, and it stays part of my life long after I've left the opera house.' –Maria Callas = 'Một vở opera bắt đầu từ rất lâu trước khi bức màn được kéo lên và kết thúc rất lâu sau khi màn hạ xuống. Nó bắt đầu trong tâm trí tôi, trở thành cuộc đời tôi, và là một phần cuộc đời tôi ngay cả khi đã rời nhà hát.' – Maria Callas

